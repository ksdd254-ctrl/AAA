*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Segoe UI",Tahoma,system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:13.5px}
.tabs{display:flex;gap:8px;margin:14px 0}
.tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 18px;border-radius:999px;cursor:pointer;font:inherit;font-weight:600}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px;position:sticky;top:0;z-index:2}
.bar input[type=search]{flex:1;min-width:180px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.bar label{display:flex;gap:6px;align-items:center;font-size:13.5px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px}
.stat span{color:var(--muted);font-size:12.5px}
.systems{color:var(--muted);font-size:13px;margin-bottom:14px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
summary{padding:11px 14px;cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:10px}
summary small{color:var(--muted);font-weight:500}
.note{padding:0 14px 8px;color:var(--muted);font-size:12.5px}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 12px;border-top:1px solid var(--line);text-align:right;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--bg)}
td.n{width:56px;text-align:center;font-variant-numeric:tabular-nums}
td.j{width:92px;text-align:center}
.tech{direction:ltr;unicode-bidi:isolate;font-family:Consolas,monospace;font-size:12.5px;color:var(--muted);word-break:break-all}
.lab{font-weight:600}
.sys{font-size:12px;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:700}
.y{background:var(--yes-bg);color:var(--yes)}.x{background:var(--no-bg);color:var(--no)}
.hide{display:none}
@media (max-width:640px){td.s,th.s{display:none}}
</style>
</head>

<h1>الأشياء المطفأة في نسخ الويندوز المعدّلة</h1>
<p class="sub">مستخرجة من ملفات النسخ نفسها (الريجستري داخل الصورة + سكربتات أول تشغيل + البلاي بوكس) ومقارنة بويندوز الأصلي. محذوف منها كل شيء له علاقة بالسيريلات أو إعدادات النت. عمود <b>JDO</b> يقول هل نظامك (JDO x QHT) يطفيها بعد أو لا.</p>

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  const d = DATA[os], q = $('#q').value.trim().toLowerCase(), onlyNo = $('#onlyNo').checked, min2 = $('#min2').checked;
  const rows = d.items.filter(r => (!onlyNo || !r.j) && (!min2 || r.n >= 2) && (!q || (r.i + ' ' + r.l + ' ' + r.s).toLowerCase().includes(q)));
  const total = d.items.length, inJ = d.items.filter(r => r.j).length;
  $('#stats').innerHTML = `<div class="stat"><b>${total}</b><span>شيء مطفي أو محذوف</span></div><div class="stat"><b style="color:var(--yes)">${inJ}</b><span>JDO يطفيها بعد</span></div><div class="stat"><b style="color:var(--no)">${total-inJ}</b><span>مو مطفية في JDO</span></div><div class="stat"><b>${d.systems.length}</b><span>نظام تمت مقارنته</span></div>`;
  $('#systems').innerHTML = 'الأنظمة: ' + d.systems.map(esc).join('، ');
  let html = '';
  for (const [k, title] of CATS){
    const list = rows.filter(r => r.c === k || (k === 'reg:النظام والأداء' && r.c === 'features-x'));
    if (!list.length) continue;
    const all = d.items.filter(r => r.c === k).length;
    html += `<details ${list.length <= 60 || q ? 'open' : ''}><summary>${esc(title)} <small>${list.length}${list.length !== all ? ' من ' + all : ''}</small></summary>`;
    if (NOTES[k]) html += `<div class="note">${esc(NOTES[k])}</div>`;
    html += '<table><thead><tr><th>الشيء</th><th class="n">كم نظام</th><th class="s">الأنظمة اللي تطفيه</th><th class="j">JDO</th></tr></thead><tbody>';
    for (const r of list){
      const name = r.l ? `<div class="lab">${esc(r.l)}</div><div class="tech">${esc(r.i)}</div>` : `<div class="tech" style="color:var(--text)">${esc(r.i)}</div>`;
      html += `<tr><td>${name}</td><td class="n">${r.n}</td><td class="s sys">${esc(r.s)}</td><td class="j">${r.j ? '<span class="pill y">مطفي</span>' : '<span class="pill x">لا</span>'}</td></tr>`;
    }
    html += '</tbody></table></details>';
  }
  $('#list').innerHTML = html || '<p class="sub">ما فيه نتائج.</p>';
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => { os = b.dataset.os; document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t === b)); render(); });
['#q','#onlyNo','#min2'].forEach(s => $(s).addEventListener('input', render));
render();
</script>
</body>
</html>
